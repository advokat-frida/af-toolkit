name: A tool idea
description: A "how do I actually do that?" that keeps coming up.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        The Toolkit exists because privacy people keep telling colleagues to do things
        and then have no answer for *how*. Use fake data. Redact that before you share
        it. Honour the opt-outs. The good ideas all sound like that.

        The bar is not "would this be neat". It is: someone asks you how, and today you
        have to say you do not know.
  - type: textarea
    id: sentence
    attributes:
      label: The sentence people say
      description: The advice that gets given, in the words it gets given in.
      placeholder: "Don't put customer data in that spreadsheet before you send it."
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What people do instead today
      description: The spreadsheet formula, the manual pass, the tool that costs more than the team.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the tool would do
      description: |
        Ideally in the house shape: drop a file in, get a file out, keep a record of what
        happened. It has to work with nothing leaving the browser.
    validations:
      required: true
