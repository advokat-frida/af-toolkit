name: npm OIDC diagnostic

# Temporary (2026-09-05): the SafeSeed publish job is refused by npm with E404 on PUT even
# with a trusted publisher configured. This prints the identity npm sees in the GitHub OIDC
# token (repository, workflow, environment, ref), the runner's npm version, and npm's exact
# answer to the token exchange. It never prints a token. Delete after the cause is known.

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Versions
        run: |
          node --version
          npm --version

      - name: Decode the OIDC token claims (no secrets printed)
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          JWT="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).value)' "$RESP")"
          node -e '
            const jwt = process.argv[1];
            const payload = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString("utf8"));
            const keep = ["iss","aud","repository","repository_owner","repository_visibility","workflow","workflow_ref","job_workflow_ref","environment","ref","ref_type","event_name","sha","runner_environment"];
            for (const k of keep) console.log(k.padEnd(22), payload[k] === undefined ? "(absent)" : String(payload[k]));
          ' "$JWT"
          echo "$JWT" > "$RUNNER_TEMP/id.jwt"
          chmod 600 "$RUNNER_TEMP/id.jwt"

      - name: Ask npm to exchange it for the safeseed package
        shell: bash
        run: |
          set -euo pipefail
          JWT="$(cat "$RUNNER_TEMP/id.jwt")"
          STATUS="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${JWT}" -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/safeseed")"
          echo "exchange HTTP status: $STATUS"
          node -e '
            const body = require("fs").readFileSync(process.argv[1], "utf8");
            let j; try { j = JSON.parse(body); } catch { console.log("body:", body.slice(0, 400)); process.exit(0); }
            if (j.token) { j.token = "(present, " + String(j.token).length + " chars, not printed)"; }
            console.log(JSON.stringify(j, null, 1).slice(0, 1200));
          ' "$RUNNER_TEMP/exchange.json"
          rm -f "$RUNNER_TEMP/id.jwt" "$RUNNER_TEMP/exchange.json"
