name: Redactorium CI

# Redactorium's build, run when its folder changes. CI=false keeps CRA from turning
# warnings into a failed build; the Toolkit gate (ci.yml) covers the staged artifact.

on:
  push:
    branches: [main]
    paths:
      - "redactorium/**"
      - ".github/workflows/redactorium-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "redactorium/**"
      - ".github/workflows/redactorium-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: redactorium/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: redactorium/frontend/package-lock.json
      # The scaffold pins date-fns 4 beside react-day-picker 8, which peers on date-fns 2/3;
      # the tree has always been installed with legacy peer resolution, and the committed
      # lockfile (with ajv 8 at the top level for webpack's schema tooling) reproduces it.
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          CI: "false"
