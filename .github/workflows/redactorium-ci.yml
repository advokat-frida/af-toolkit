name: Redactorium CI

# Redactorium's tests, lint and build, run when its folder changes. Vite since 2026-09-11 (it
# replaced Create React App); the Toolkit gate (ci.yml) covers the staged artifact.

on:
  push:
    branches: [main]
    paths:
      - "redactorium/**"
      - ".github/workflows/redactorium-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "redactorium/**"
      - ".github/workflows/redactorium-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: redactorium/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: redactorium/frontend/package-lock.json
      # Legacy peer resolution lives in frontend/.npmrc, where Dependabot and a human install
      # read it too. xlsx installs from the SheetJS CDN tarball the lock pins by sha512.
      - run: npm ci --no-audit --no-fund
      - name: Engine tests (detection, treatments, Word cleaning, the record)
        run: npm test
      - name: Lint (the React hooks rules the CRA build used to enforce)
        run: npm run lint
      - name: Build
        run: npm run build
