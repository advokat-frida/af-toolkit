name: SafeList CI

# SafeList's own gate (engine tests, build, the sample run), run when its folder changes.
# The Toolkit gate (ci.yml) covers the staged artifact on every push.

on:
  push:
    branches: [main]
    paths:
      - "safelist/**"
      - ".github/workflows/safelist-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "safelist/**"
      - ".github/workflows/safelist-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: safelist

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tests, build, sample run
        run: npm run check
