name: Privacy Wizards CI

# The Council's own gate (vitest, style audit, build, artifact verification), run when its
# folder changes. The Toolkit gate (ci.yml) covers the staged artifact on every push.

on:
  push:
    branches: [main]
    paths:
      - "privacy-wizards-council/**"
      - ".github/workflows/wizards-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "privacy-wizards-council/**"
      - ".github/workflows/wizards-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: privacy-wizards-council

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: privacy-wizards-council/package-lock.json
      - run: npm ci
      - name: Tests, style audit, build, artifact verification
        run: npm run check
      # The check regenerates the registry modules and rebuilds dist/wizards.html. A committed copy
      # that differs is stale: the Toolkit would serve content the source no longer says.
      - name: Committed registry modules and build match the source
        run: |
          if ! git diff --exit-code --stat -- src/lib/data dist/wizards.html; then
            echo "::error::The committed registry modules or dist/wizards.html are stale. In privacy-wizards-council run npm ci and npm run check, then npm run build:tools at the repository root, and commit the result."
            exit 1
          fi
