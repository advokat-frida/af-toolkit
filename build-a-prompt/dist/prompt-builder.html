        <h1>Build-A-Prompt</h1>
        <p>A useful prompt names five things: the outcome, context, evidence, guardrails, and format.</p>
        <ol>
          <li><strong>Outcome:</strong> say what the AI should produce.</li>
          <li><strong>Context:</strong> name the audience and operating reality.</li>
          <li><strong>Evidence:</strong> say what material it may rely on.</li>
          <li><strong>Guardrail:</strong> name what it must not invent or do.</li>
          <li><strong>Format:</strong> describe the usable shape of the answer.</li>
